# Crypto Relative-Strength Screener — runtime configuration.
# See IMPLEMENTATION_PLAN.md for the design behind every field.

exchange: coindcx          # primary data source: coindcx | ccxt
ccxt_exchange: binance     # used only when exchange == ccxt

# Coin universe. Either an explicit watchlist, or auto top-N by 24h volume.
universe:
  mode: watchlist          # watchlist | top_volume
  watchlist: [BTC, ETH, SOL, BNB, XRP, ADA, DOGE, AVAX, LINK, MATIC, DOT, LTC]
  top_n: 40                # used when mode == top_volume
  min_quote_volume_24h: 100000   # liquidity floor (in quote currency, USDT-equiv)

# Bases each coin is measured against.
bases: [BTC, ETH, USDT, INR, INDEX]

# Timeframes for the matrix (3m is resampled from 1m on CoinDCX).
timeframes: [1w, 1d, 4h, 1h, 15m, 3m]

# Noise-filter / classification thresholds (see plan sec 4.7).
# Per-timeframe overrides fall back to `default`.
classifier:
  default:
    ema_len: 21
    vol_lookback: 90
    neutral_band: 1.0      # z-score deadband for bull/bear
    hysteresis_out: 0.6    # sticky exit threshold (< neutral_band)
    persistence: 2         # consecutive closed candles required to flip
    weights: { z_return: 1.0, ema_pos: 1.0, ema_slope: 1.0 }
  per_timeframe:
    3m:  { vol_lookback: 100, neutral_band: 1.2, persistence: 3 }
    15m: { vol_lookback: 96,  neutral_band: 1.0, persistence: 2 }
    1h:  { vol_lookback: 90,  neutral_band: 1.0, persistence: 2 }
    4h:  { vol_lookback: 90,  neutral_band: 0.8, persistence: 2 }
    1d:  { vol_lookback: 60,  neutral_band: 0.8, persistence: 1 }
    1w:  { vol_lookback: 52,  neutral_band: 0.7, persistence: 1 }
    # CoinDCX serves at most 1000 daily candles, so a coin has ~32 closed
    # months at best: a shorter EMA and lookback fit that history.
    1M:  { ema_len: 10, vol_lookback: 24, neutral_band: 0.7, persistence: 1 }

# Sector / narrative tags (coin -> sectors). Used for sector RS aggregation.
sectors:
  BTC: [Store-of-Value]
  ETH: [L1, Smart-Contract]
  SOL: [L1, Smart-Contract]
  BNB: [L1, Exchange]
  XRP: [Payments]
  ADA: [L1]
  DOGE: [Memes]
  AVAX: [L1]
  LINK: [Oracle, DeFi]
  MATIC: [L2]
  DOT: [L1, Interop]
  LTC: [Payments]

# Data fetching.
data:
  candle_limit: 500        # candles per (symbol, tf) request
  cache_dir: data_cache
  stale_multiplier: 3      # cell is 'unknown' if last candle older than this * tf
  watchlists_file: data_cache/watchlists.json   # custom watchlists (BTC Strength page)

# Coins-vs-BTC board (frontend/pages/1_BTC_Strength.py).
btc_strength:
  timeframes: [1h, 4h, 1d, 1w, 1M]
  # Trend = last closed candle of trend_timeframe against these EMAs.
  trend_timeframe: 1d
  trend_emas: { short: 20, medium: 50, long: 200 }
  workers: 8               # coins fetched in parallel
  # Left out of "top N" lists: they only mirror another asset. Any symbol that
  # starts or ends with USD is dropped as a stablecoin too.
  exclude: [DAI, EURI, EURC, FRAX, XAUT, PAXG, WBTC, WETH, WBETH, STETH, WSTETH,
            CBBTC, BTCB, TBTC, SOLVBTC, BNSOL, JITOSOL, MSOL, WEETH, EZETH, RETH]

# Liquidation heatmap (frontend/pages/2_Liquidation_Heatmap.py): estimated
# liquidation levels from Binance futures open interest. leverages = share of
# new positions opened at each leverage; the maintenance margin makes a
# position liquidate slightly before its full margin is gone.
liquidation:
  leverages: { 10: 0.30, 25: 0.30, 50: 0.25, 100: 0.15 }
  maintenance_margin: 0.005
  bins: 400

# Price / trendline / zone alerts (Alerts page, and the bell box under charts).
# They are checked on 1-minute Binance futures candles while any dashboard page
# is open, or all the time with: python -m backend.cli alerts
alerts:
  db: data_cache/alerts.db
  check_seconds: 60        # how often an open dashboard page checks them
  desktop: true            # Windows pop-up when one fires; Telegram too if .env has it

# Order execution on CoinDCX INR-margined futures (Trade page, `backend.cli trade`).
# dry_run logs every order and sends nothing. Set live only after a dry run
# looks right. Keys go in .env (COINDCX_API_KEY / COINDCX_API_SECRET), never here.
trading:
  mode: dry_run            # dry_run | live
  db: data_cache/trading.db
  fill_timeout_s: 20       # wait this long for a market entry to fill before SL/TP
  close_unprotected: false # true = the watcher closes any position with no stop loss
  limits:                  # a trade that breaks any of these is refused
    max_risk_inr: 500      # most you can lose on one trade if its stop is hit
    max_margin_inr: 5000   # most margin one trade may lock
    max_leverage: 5
    max_open_positions: 3
    max_daily_loss_inr: 1500   # no new trades after losing this much today (UTC)
    min_stop_pct: 0.3      # refuse a stop closer than this % to entry
    allowed_pairs: []      # e.g. [BTC, ETH, SOL]; empty = any active INR pair

# Index base construction.
index:
  exclude: [BTC]           # equal-weight alt index excludes these
